services:
  mongodb1:
    image: mongo:latest
    container_name: mongodb1
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: admin_db
    volumes:
    - "data-mongo1:/data/db"

  mongodb2:
    image: mongo:latest
    container_name: mongodb2
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: admin_db
    volumes:
    - type: volume
      source: data-mongo2
      target: "/data/db"
      read_only: false

volumes:
  data-mongo1:
    name: data-mongo1
  data-mongo2:
    name: data-mongo2